services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - inventory-pg:/var/lib/postgresql/data

  inventory:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INVENTORY_DATABASE_URL: postgres://inventory:inventory@postgres:5432/inventory?sslmode=disable
      INVENTORY_AUTH_TOKEN: dev-token
      INVENTORY_GRPC_ADDR: ":19090"
      INVENTORY_HTTP_ADDR: ":18080"
    ports:
      - "19090:19090"
      - "18080:18080"

volumes:
  inventory-pg:
